name: First-run macOS installer (Core preservation)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax and published Core v0.3 checksum pins
        shell: bash
        run: |
          set -euo pipefail
          bash -n docs/install-macos.sh
          grep -Fq 'CORE_TAG="v0.3.0-stateless-pq"' docs/install-macos.sh
          grep -Fq 'CORE_SHA_ARM="5693e22bf4cb9b51293f149852ff342e577de5fee6b422659c758c64cac75267"' docs/install-macos.sh
          grep -Fq 'CORE_SHA_X64="af471b282c1f1d75ea3830c63332b7db78f91ed0ca7ba0895269e3c88f6a389c"' docs/install-macos.sh
      - name: Read-only discovery detects existing Core; legacy P2Pool installation is blocked
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          home="$work/home"
          mkdir -p "$home" "$work/mock"
          HOME="$home" bash docs/install-macos.sh --probe > "$work/clean"
          grep -q CORE_ABSENT "$work/clean"
          mkdir -p "$home/Library/Application Support/Byze"
          HOME="$home" bash docs/install-macos.sh --probe > "$work/data"
          grep -q CORE_FOUND "$work/data"
          grep -q DO_NOT_REINSTALL "$work/data"
          rm -rf "$home/Library/Application Support/Byze"
          mkdir -p "$home/ldev/byze-v0.3.0" "$home/.local/bin" "$home/.local/opt/old-p2pool"
          printf '#!/bin/sh\nexit 0\n' > "$home/ldev/byze-v0.3.0/byze-cli"
          chmod 700 "$home/ldev/byze-v0.3.0/byze-cli"
          printf '#!/bin/sh\n# BYZE_P2POOL_MANAGED_LAUNCHER\nexit 0\n' > "$home/.local/bin/byze-p2pool"
          chmod 700 "$home/.local/bin/byze-p2pool"
          printf 'existing\n' > "$home/.local/opt/old-p2pool/protected"
          HOME="$home" bash docs/install-macos.sh --probe > "$work/client"
          grep -q REUSE_ONLY "$work/client"
          cat > "$work/mock/curl" <<'MOCK'
          #!/bin/sh
          echo 'Unexpected download' >&2
          exit 99
          MOCK
          chmod 700 "$work/mock/curl"
          if HOME="$home" PATH="$work/mock:$PATH" bash docs/install-macos.sh --install > "$work/block" 2>&1; then
            echo 'Obsolete Community Test 2 installer must not run' >&2
            exit 1
          fi
          grep -q 'installer paused' "$work/block"
          test -f "$home/.local/opt/old-p2pool/protected"
          grep -q BYZE_P2POOL_MANAGED_LAUNCHER "$home/.local/bin/byze-p2pool"
          test -x "$home/ldev/byze-v0.3.0/byze-cli"
          ! grep -q 'Unexpected download' "$work/block"
      - name: Existing CLI sync monitoring remains read-only and resumable
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          home="$work/home"
          mkdir -p "$home/ldev/byze-v0.3.0" "$home/.local/bin"
          cat > "$home/ldev/byze-v0.3.0/byze-cli" <<'CLI'
          #!/bin/sh
          if [ "$1" = getblockchaininfo ]; then
            count=0
            [ ! -f "$SYNC_COUNT" ] || count="$(cat "$SYNC_COUNT")"
            count=$((count + 1))
            echo "$count" > "$SYNC_COUNT"
            case "$count" in
              1) echo '{"chain":"main","blocks":500,"headers":1000,"initialblockdownload":true}' ;;
              *) echo '{"chain":"main","blocks":1000,"headers":1000,"initialblockdownload":false}' ;;
            esac
          fi
          CLI
          printf '#!/bin/sh\nexit 0\n' > "$home/.local/bin/byze-p2pool"
          chmod 700 "$home/ldev/byze-v0.3.0/byze-cli" "$home/.local/bin/byze-p2pool"
          SYNC_COUNT="$work/count" HOME="$home" BYZE_SYNC_INTERVAL_SECONDS=0 BYZE_SYNC_MAX_POLLS=3 \
            bash docs/install-macos.sh --wait-sync > "$work/progress"
          grep -Fq '500 / 1000 blocks (50.0% by height); IBD: true' "$work/progress"
          grep -q BYZE_NODE_READY "$work/progress"
