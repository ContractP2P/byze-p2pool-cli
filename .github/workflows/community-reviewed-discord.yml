name: BYZE P2Pool - operator-reviewed community Discord blocks

on:
  schedule:
    # Pending operator-reviewed blocks become publishable after six confirmations.
    - cron: '23,53 * * * *'
  pull_request:
    paths:
      - 'cli/config/operator-reviewed-blocks.json'
      - 'cli/evidence/blocks/*.json'
      - 'cli/tools/chain-monitor/publish-reviewed-community.cjs'
      - 'cli/tools/chain-monitor/publish-reviewed-community.test.cjs'
      - '.github/workflows/community-reviewed-discord.yml'
  push:
    branches: [main]
    paths:
      - 'cli/config/operator-reviewed-blocks.json'
      - 'cli/evidence/blocks/*.json'
      - 'cli/tools/chain-monitor/publish-reviewed-community.cjs'
      - 'cli/tools/chain-monitor/publish-reviewed-community.test.cjs'
      - '.github/workflows/community-reviewed-discord.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Revalidate current canonical chain without posting to Discord'
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: byze-p2pool-chain-monitor
  cancel-in-progress: false

jobs:
  review_and_publish:
    if: ${{ vars.BYZE_MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate publisher syntax and dependencies
        run: |
          node --check cli/tools/chain-monitor/publish-reviewed-community.cjs
          npm ci --prefix cli --ignore-scripts --no-audit --no-fund
          node --test cli/tools/chain-monitor/publish-reviewed-community.test.cjs
      - name: Dry-run with fresh BYZE chain and immutable evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMUNITY_DRY_RUN: 'true'
          BYZE_TIP_URL: ${{ vars.BYZE_TIP_URL || 'https://explorer.byze.org/api/status' }}
          BYZE_BLOCK_URL_TEMPLATE: ${{ vars.BYZE_BLOCK_URL_TEMPLATE || 'https://explorer.byze.org/api/block/{id}' }}
          BYZE_TX_URL_TEMPLATE: ${{ vars.BYZE_TX_URL_TEMPLATE }}
          BYZE_VALUE_MODE: ${{ vars.BYZE_VALUE_MODE }}
        run: node cli/tools/chain-monitor/publish-reviewed-community.cjs
      - name: Publish reviewed blocks to Discord (only after successful dry run)
        if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.BYZE_P2POOL_DISCORD_WEBHOOK }}
          BYZE_TIP_URL: ${{ vars.BYZE_TIP_URL || 'https://explorer.byze.org/api/status' }}
          BYZE_BLOCK_URL_TEMPLATE: ${{ vars.BYZE_BLOCK_URL_TEMPLATE || 'https://explorer.byze.org/api/block/{id}' }}
          BYZE_TX_URL_TEMPLATE: ${{ vars.BYZE_TX_URL_TEMPLATE }}
          BYZE_VALUE_MODE: ${{ vars.BYZE_VALUE_MODE }}
        run: node cli/tools/chain-monitor/publish-reviewed-community.cjs
