name: Linux first-run installer (BYZE Core preservation)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/core-detection-before-network-preflight]
permissions:
  contents: read
jobs:
  no-duplicate-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate shell syntax and offline Core discovery
        shell: bash
        run: |
          set -euo pipefail
          bash -n docs/install-linux.sh
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/home" "$work/mock"
          cat > "$work/mock/curl" <<'CURL'
          #!/bin/sh
          echo UNEXPECTED_CURL >> "$CURL_LOG"
          exit 99
          CURL
          chmod +x "$work/mock/curl"
          export CURL_LOG="$work/curl.log"
          HOME="$work/home" PATH="$work/mock:$PATH" bash docs/install-linux.sh --probe > "$work/clean"
          grep -q 'CORE_ABSENT' "$work/clean"
          mkdir -p "$work/home/.byze"
          HOME="$work/home" PATH="$work/mock:$PATH" bash docs/install-linux.sh --probe > "$work/data"
          grep -q 'CORE_FOUND' "$work/data"
          grep -q 'DO_NOT_REINSTALL' "$work/data"
          if HOME="$work/home" PATH="$work/mock:$PATH" bash docs/install-linux.sh --install > "$work/blocked" 2>&1; then
            echo 'Existing Core data must block install' >&2; exit 1
          fi
          grep -q 'Existing Core footprint' "$work/blocked"
          test ! -e "$work/curl.log"
          test -d "$work/home/.byze"
          echo 'PASS: existing Core data preserved without a network request'
      - name: Reuse existing Core and P2Pool without downloads
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          home="$work/home"
          mkdir -p "$home/byze/build/bin" "$home/.local/opt/byze-p2pool-0.2.5-rc3-linux-x64/bin" "$work/mock"
          cat > "$home/byze/build/bin/byze-cli" <<'CLI'
          #!/bin/sh
          if [ "$1" = getblockchaininfo ]; then
            printf '{"chain":"main","blocks":5,"headers":5}\n'
            exit 0
          fi
          exit 1
          CLI
          cat > "$home/.local/opt/byze-p2pool-0.2.5-rc3-linux-x64/bin/byze-p2pool" <<'POOL'
          #!/bin/sh
          if [ "$1" = --version ]; then echo 0.2.5-rc3; exit 0; fi
          if [ "$1" = --check-node ]; then echo BYZE_NODE_READY; exit 0; fi
          exit 1
          POOL
          cat > "$work/mock/curl" <<'CURL'
          #!/bin/sh
          echo 'Network must not be needed for existing Core + pool' >&2
          exit 99
          CURL
          chmod +x "$home/byze/build/bin/byze-cli" \
            "$home/.local/opt/byze-p2pool-0.2.5-rc3-linux-x64/bin/byze-p2pool" "$work/mock/curl"
          HOME="$home" PATH="$work/mock:$PATH" bash docs/install-linux.sh --install > "$work/result"
          grep -q 'CORE_ACTION: REUSE_ONLY' "$work/result"
          grep -q 'BYZE_NODE_READY' "$work/result"
          grep -qx '# BYZE_P2POOL_MANAGED_LAUNCHER' "$home/.local/bin/byze-p2pool"
          test -f "$home/byze/build/bin/byze-cli"
          echo 'PASS: no BYZE Core/CLI redownload or replacement'
      - name: Core absent without signed public P2Pool asset cannot alter machine
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/home" "$work/mock"
          cat > "$work/mock/curl" <<'CURL'
          #!/bin/sh
          exit 22
          CURL
          chmod +x "$work/mock/curl"
          if HOME="$work/home" PATH="$work/mock:$PATH" bash docs/install-linux.sh --install > "$work/out" 2>&1; then
            echo 'Expected fail-closed without Linux release' >&2; exit 1
          fi
          grep -q 'not published' "$work/out"
          test ! -d "$work/home/.local/opt"
          echo 'PASS: no partial Core install on unavailable P2Pool release'
