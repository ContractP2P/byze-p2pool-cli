name: Linux first-run installer (BYZE Core preservation)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  no-duplicate-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Shell syntax and official Core v0.3 pin
        shell: bash
        run: |
          set -euo pipefail
          bash -n docs/install-linux.sh
          grep -Fq 'CORE_TAG=v0.3.0-stateless-pq' docs/install-linux.sh
          grep -Fq 'CORE_SHA=6278412d3376b653172bd2f4c84d21af513526feba30d9363b5f3efb2707e0c2' docs/install-linux.sh
      - name: Offline discovery and legacy installer fail-closed preserve wallets
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          mkdir -p "$work/home" "$work/mock"
          cat > "$work/mock/curl" <<'CURL'
          #!/bin/sh
          echo UNEXPECTED_DOWNLOAD >&2
          exit 99
          CURL
          chmod 700 "$work/mock/curl"
          HOME="$work/home" PATH="$work/mock:$PATH" bash docs/install-linux.sh --probe > "$work/clean"
          grep -q CORE_ABSENT "$work/clean"
          mkdir -p "$work/home/.byze" "$work/home/.local/opt/old-p2pool"
          printf 'keep\n' > "$work/home/.local/opt/old-p2pool/test"
          HOME="$work/home" PATH="$work/mock:$PATH" bash docs/install-linux.sh --probe > "$work/data"
          grep -q DO_NOT_REINSTALL "$work/data"
          if HOME="$work/home" PATH="$work/mock:$PATH" bash docs/install-linux.sh --install > "$work/block" 2>&1; then
            echo 'Obsolete Community Test 2 installer must not proceed' >&2; exit 1
          fi
          grep -q 'installer paused' "$work/block"
          ! grep -q UNEXPECTED_DOWNLOAD "$work/block"
          test -f "$work/home/.local/opt/old-p2pool/test"
          test -d "$work/home/.byze"
      - name: Core sync monitor remains available without restarting daemon
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          home="$work/home"
          mkdir -p "$home/ldev/byze-v0.3.0" "$home/.local/bin"
          cat > "$home/ldev/byze-v0.3.0/byze-cli" <<'CLI'
          #!/bin/sh
          if [ "$1" = getblockchaininfo ]; then
            count=0
            [ ! -f "$SYNC_COUNT" ] || count="$(cat "$SYNC_COUNT")"
            count=$((count + 1))
            echo "$count" > "$SYNC_COUNT"
            case "$count" in
              1) echo '{"chain":"main","blocks":500,"headers":1000,"initialblockdownload":true}' ;;
              *) echo '{"chain":"main","blocks":1000,"headers":1000,"initialblockdownload":false}' ;;
            esac
          fi
          CLI
          printf '#!/bin/sh\nexit 0\n' > "$home/.local/bin/byze-p2pool"
          chmod 700 "$home/ldev/byze-v0.3.0/byze-cli" "$home/.local/bin/byze-p2pool"
          SYNC_COUNT="$work/count" HOME="$home" BYZE_SYNC_INTERVAL_SECONDS=0 BYZE_SYNC_MAX_POLLS=3 \
            bash docs/install-linux.sh --wait-sync > "$work/progress"
          grep -Fq '500 / 1000 blocks (50.0% by height); IBD: true' "$work/progress"
          grep -q BYZE_NODE_READY "$work/progress"
      - name: Verify signed official Byze Core v0.3 archive (download only)
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          node cli/tools/download-core.js --dest "$work/verified-core" --platform linux-x64
          archive="$work/verified-core/byze-core-linux-x86_64.tar.gz"
          test -s "$archive"
          tar -tzf "$archive" > "$work/archive-files"
          grep -Fq 'byzed' "$work/archive-files"
          grep -Fq 'byze-cli' "$work/archive-files"
      - name: Validate website installer JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("docs/index.html").read_text()
          scripts=re.findall(r'<script>(.*?)</script>',html,re.DOTALL)
          assert len(scripts)==1
          assert "FORK_P2POOL_INSTALLER_PAUSED = true" in scripts[0]
          Path("/tmp/byze-v03-install-site-inline.js").write_text(scripts[0])
          PY
          node --check /tmp/byze-v03-install-site-inline.js
